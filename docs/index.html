<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聴">
<meta name="theme-color" content="#0f766e">
<title>聴</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>聴</h1>
  <label class="btn primary">取り込む
    <input id="picker" type="file" multiple hidden
      accept="audio/*,.mp3,.m4a,.m4b,.aac,.wav,.flac,.aif,.aiff,.caf">
  </label>
</header>

<div class="bar">
  <select id="group" aria-label="グループ"></select>
  <select id="sortKey" aria-label="並べ替え">
    <option value="name">ファイル名</option>
    <option value="imported">取り込んだ日</option>
    <option value="modified">ファイルの日付</option>
    <option value="duration">長さ</option>
  </select>
  <button id="sortDir" class="btn" type="button">昇順</button>
  <span id="storage" class="muted"></span>
</div>

<p id="msg" class="msg" hidden></p>

<ul id="list" class="list"></ul>
<p id="empty" class="empty" hidden>曲がありません。「取り込む」から「ファイル」の Dropbox などを開いて選んでください。</p>

<details class="diag">
  <summary>情報</summary>
  <pre id="diag"></pre>
</details>

<dialog id="sheet" class="sheet">
  <form method="dialog">
    <p id="sheetTitle" class="sheet-title"></p>
    <button class="btn" value="group">グループを変える</button>
    <button class="btn danger" value="delete">削除</button>
    <button class="btn" value="">やめる</button>
  </form>
</dialog>

<footer class="player">
  <div id="nowTitle" class="now">（未選択）</div>
  <div class="seek">
    <span id="tCur">0:00</span>
    <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="再生位置">
    <span id="tDur">0:00</span>
  </div>
  <div class="controls">
    <button class="btn" data-skip="-30" type="button">-30</button>
    <button class="btn" data-skip="-10" type="button">-10</button>
    <button id="playBtn" class="btn play" type="button" aria-label="再生">▶</button>
    <button class="btn" data-skip="10" type="button">+10</button>
    <button class="btn" data-skip="30" type="button">+30</button>
  </div>
  <div class="speed">
    <span id="rateVal" class="rate">1.00×</span>
    <input id="rate" type="range" min="0.5" max="3" step="0.05" value="1" aria-label="速度">
  </div>
  <div class="presets">
    <button class="btn" data-rate="0.8" type="button">0.8</button>
    <button class="btn" data-rate="1" type="button">1.0</button>
    <button class="btn" data-rate="1.25" type="button">1.25</button>
    <button class="btn" data-rate="1.5" type="button">1.5</button>
    <button class="btn" data-rate="2" type="button">2.0</button>
    <label class="auto"><input id="autoNext" type="checkbox"> 次へ</label>
  </div>
  <div class="ab">
    <button id="abA" class="btn" type="button">A</button>
    <button id="abB" class="btn" type="button">B</button>
    <button id="abClear" class="btn" type="button">解除</button>
    <span id="abText" class="muted"></span>
  </div>
  <audio id="audio" preload="auto"></audio>
</footer>

<script src="app.js"></script>
</body>
</html>
