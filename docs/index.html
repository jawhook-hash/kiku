<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聴">
<meta name="theme-color" content="#0f766e">
<title>聴</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>聴</h1>
  <label class="btn primary">取り込む
    <input id="picker" type="file" multiple hidden
      accept="audio/*,.mp3,.m4a,.m4b,.aac,.wav,.flac,.aif,.aiff,.caf">
  </label>
</header>

<div class="bar">
  <select id="group" aria-label="グループ"></select>
  <select id="sortKey" aria-label="並べ替え">
    <option value="name">ファイル名</option>
    <option value="imported">取り込んだ日</option>
    <option value="modified">ファイルの日付</option>
    <option value="duration">長さ</option>
  </select>
  <button id="sortDir" class="btn" type="button">昇順</button>
  <button id="selectBtn" class="btn" type="button">選ぶ</button>
  <span id="storage" class="muted"></span>
</div>

<div id="selBar" class="selbar" hidden>
  <button id="selAll" class="btn" type="button">すべて選択</button>
  <button id="selGroup" class="btn primary" type="button">グループへ</button>
  <button id="selDelete" class="btn danger" type="button">削除</button>
  <button id="selCancel" class="btn" type="button">やめる</button>
</div>

<p id="msg" class="msg" hidden></p>

<ul id="list" class="list"></ul>
<p id="empty" class="empty" hidden>曲がありません。「取り込む」から「ファイル」の Dropbox などを開いて選んでください。</p>

<details class="diag">
  <summary>情報</summary>
  <pre id="diag"></pre>
</details>

<dialog id="sheet" class="sheet">
  <form method="dialog">
    <p id="sheetTitle" class="sheet-title"></p>
    <button class="btn" value="group">グループを変える</button>
    <button class="btn danger" value="delete">削除</button>
    <button class="btn" value="">やめる</button>
  </form>
</dialog>


<script src="player.js"></script>
<script src="app.js"></script>
</body>
</html>
